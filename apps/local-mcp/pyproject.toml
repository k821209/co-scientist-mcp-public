[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist-local"
version = "0.1.20260822"
description = "Local MCP server for co-scientist-cloud (Claude Code <-> Firestore)"
requires-python = ">=3.11"
dependencies = [
    # mcp_server.py imports `mcp.server.fastmcp.FastMCP`, and that module exists
    # ONLY in the 1.2 – 1.x range. The old `>=1.0.0` spec was wrong at BOTH ends:
    # 1.0.0 and 1.1.0 have no `mcp.server.fastmcp` at all, so the declared range
    # never described what the code imports — the missing ceiling is just what
    # made it visible. mcp 2.0.0 renamed FastMCP to MCPServer under
    # `mcp.server.mcpserver`, so every fresh install after its release resolved to
    # 2.0.0 and died at import with CONNECTION_CLOSED and no stated cause
    # (feedback 01606ac4f264). Porting to the 2.0 API is separate work; this spec
    # states the truth about today's code.
    "mcp>=1.2,<2",
    "pydantic>=2.6",
    # API-key mode (the production path) talks to Firestore via the
    # google-cloud SDK with a user-token credential.
    "google-cloud-firestore>=2.16",
    # Service-account / developer fallback mode.
    "firebase-admin>=6.5",
    "google-cloud-storage>=2.16",
    # paper-deck Phase 3 — PPTX export.
    "python-pptx>=1.0",
    # Composing multi-panel figures into the single image a journal expects.
    # python-pptx already pulls Pillow in, but this module imports it directly,
    # and an undeclared transitive dependency is one upstream change away from
    # breaking figure composition with no warning.
    "pillow>=10.0",
    # Report/other doc export — native .docx via python-docx (pandoc OOXML
    # crashes Hancom Office). markdown-it-py parses the manuscript markdown.
    "python-docx>=1.1",
    "markdown-it-py>=2.2",
    # paper-import — PDF text extraction (docx goes through pandoc).
    "pypdf>=4.0",
    # paper-deck Phase 4 (todo 004 §A) — per-slide PNG render from the
    # sibling PDF so the agent can run a vision critique on the deck.
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# Dev-only. Everything an END USER needs is in `dependencies` above —
# `pip install -e apps/local-mcp` is all it takes.
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
co-scientist-local = "co_scientist_local.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["co_scientist_local*"]

[tool.setuptools.package-data]
# Claude Code skills bundled into the wheel so a non-editable
# `pip install git+…#subdirectory=apps/local-mcp` carries them too. In the
# private repo this dir is absent (canonical lives at repo-root packages/skills
# and is resolved at runtime); the publish step materializes it into the
# public package. See co_scientist_local/skills_install.py.
co_scientist_local = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
asyncio_mode = "auto"
